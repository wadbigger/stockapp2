<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockApp - Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #111827 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; stroke: #60a5fa; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #9ca3af; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .status {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      font-size: 0.85rem;
      color: #6b7280;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; margin-right: 6px; }
    .dot.online { background: #22c55e; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Connexion impossible</h1>
    <p>
      StockApp ne peut pas se connecter au serveur.<br/>
      Vérifiez que le serveur est démarré et que votre connexion réseau est active.
    </p>
    <button class="btn" onclick="window.location.reload()">Réessayer</button>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Vérification...</span>
    </div>
  </div>
  <script>
    function checkConnection() {
      var dot = document.getElementById('statusDot');
      var text = document.getElementById('statusText');
      fetch('/api/health', { cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            dot.className = 'dot online';
            text.textContent = 'Serveur disponible ! Rechargement...';
            setTimeout(function() { window.location.href = '/'; }, 1000);
          } else {
            dot.className = 'dot';
            text.textContent = 'Serveur indisponible';
          }
        })
        .catch(function() {
          dot.className = 'dot';
          text.textContent = 'Serveur indisponible';
        });
    }
    checkConnection();
    setInterval(checkConnection, 5000);
  </script>
</body>
</html>
